[workspace]
name = "kaichi"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
anndata = ">=0.12.13,<0.13"
muon = ">=0.1.7,<0.2"
pandas = ">=2.3.3,<3"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
pyarrow = ">=14"

[pypi-dependencies]
kaichi = ">=0.2.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) kaichi.yaml && printf '# auto-generated by pixi — do not edit by hand\\n' | cat - kaichi.yaml > kaichi.yaml.tmp && mv kaichi.yaml.tmp kaichi.yaml"
